spring.profiles.active=avo
#spring.profiles.active=ausol
#spring.profiles.active=tg
# server.port=8090
server.servlet.context-path=/openits/
spring.application.name=openits
server.servlet.application-display-name=openits

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5430/rits
spring.datasource.username=rits
spring.datasource.password=rits

# ===============================
# JPA / HIBERNATE
# ===============================
 
#spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ui
 
 
# Fix Postgres JPA Error:
# Method org.postgresql.jdbc.PgConnection.createClob() is not yet implemented.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults= false


# No inclusion of null values
spring.jackson.default-property-inclusion=non-null

auth.required=false
auth.retries=3


datasouce.type.graphql=1

graphql.debug=true
rest.debug=true

# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Max file size.
spring.servlet.multipart.max-file-size=1GB
# Max Request Size
spring.servlet.multipart.max-request-size=1GB

file.basedir=/tmp/openits
