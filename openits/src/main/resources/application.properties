spring.profiles.active=bratislava
# spring.profiles.active=desktop
# spring.profiles.active=ausol
# server.port=8090
# server.servlet.context-path=/openits/
spring.application.name=openits
server.servlet.application-display-name=openits

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5430/rits
spring.datasource.username=rits
spring.datasource.password=rits

# ===============================
# JPA / HIBERNATE
# ===============================
 
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=ui
 
 
# Fix Postgres JPA Error:
# Method org.postgresql.jdbc.PgConnection.createClob() is not yet implemented.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults= false

# No inclusion of null values
spring.jackson.default-property-inclusion=non-null

graphql.url=http://localhost:8082/graphql

data.source.type.graphql=1

data.source.graphql.url=1
data.source.graphql.method=2
data.source.graphql.params=3
data.source.graphql.content=4

data.source.get_elements_by_element_type=1
data.source.get_element_types=2
data.source.get_element_type_by_id=4
data.source.get_elements=5
data.source.get_element=6

grid.adapter.element=2
datasouce.type.graphql=1