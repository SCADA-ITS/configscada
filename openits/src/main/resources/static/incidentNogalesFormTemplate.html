<!DOCTYPE html>

<html>

<head>
	<script src="./lib/webix/webix.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

	<link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

	<script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

	<script type="text/javascript" src="./data/config.js"></script>
	<script type="text/javascript" src="./data/constants.js"></script>
	
	<style>
	
	.print-template {
		padding: 5px;
	}
	
	.print-template-header {
		box-sizing: border-box;
		display:flex;
	}
	
	.print-template-logo {
		width: 20%;
		flex-direction: row;	
	}
	
	.print-data {
		width: 80%;
		padding:inherit;
	}
	
	.print-user-data {
		display: flex;
		justify-content: space-between;
	}

	.print-section {
		margin: 50px 5px;
	}
	
	.print-separators {	
 		font-family: Roboto;
		font-size: 12px;
		font-style: italic;
    	font-weight: bold;
		color:var(--blue-text-default);
	}

	.print-texts {	
		width:100%;
		font-family: Roboto;
		font-weight: bold;
		color:var(--blue-text-default);		
	}
	
	.print-texts h2 {	
		font-style: italic;
		font-size: 14px;	
	}
	
	.print-texts span {
		font-size: 18px;
	}
	
	.print-incident-number {
		width: 80%;
		height: 50px;
		padding-left: 10px;
		display: inherit;
		align-items: center;
		border: 1px solid var(--global-grey);	
		background-color: var(--global-grey);	
}
	
	</style>
</head>

<body>
	<div id="template" class="print-template">

		<div class="print-template-header">
			<h1 class="print-incident-number">Número de incidencia: <span id="field.incident_report_id"></span></h1>
			<img class="print-template-logo" src="./img/logo-project.svg">
		</div>

		<div class="print-data">
			<section class="print-section">
				<div>
					<span class="print-separators">Datos del usuario</span>
					<hr>
				</div>
				<div class="print-user-data">
					<div class="print-texts">
						<h2>Usuario:</h2>
						<span id="field.user_n"></span>
					</div>
					<div class="print-texts">
						<h2>Teléfono:</h2>
						<span id="field.phone"></span>
					</div>
				</div>
			</section>

			<section class="print-section">
				<div>
					<span class="print-separators">Datos de la vía</span>
					<hr>
				</div>
				<div class="print-user-data">

					<div class="print-texts">
						<h2>Localización:</h2>
						<span id="field.location_id"></span>
					</div>

					<div class="print-texts">
						<h2>Nivel:</h2>
						<span id="field.level_id"></span>
					</div>

					<div class="print-texts">
						<h2>Condición de carretera:</h2>
						<span id="field.road_condition_id"></span>
					</div>

					<div class="print-texts">
						<h2>Fuente:</h2>
						<span id="field.source_id"></span>
					</div>

				</div>
			</section>

			<section class="print-section">
				<div>
					<span class="print-separators">Datos de la incidencia</span>
					<hr>
				</div>
				<div class="print-user-data">

					<div class="print-texts">
						<h2>Tipo:</h2>
						<span id="field.type_id"></span>
					</div>

					<div class="print-texts">
						<h2>Subtipo:</h2>
						<span id="field.sub_type_id"></span>
					</div>

					<div class="print-texts">
						<h2>Estado:</h2>
						<span id="field.state_id"></span>
					</div>

					<div class="print-texts">
						<h2>Detección:</h2>
						<span id="field.type_detection_id"></span>
					</div>

				</div>
			</section>

		</div>

		<table id="print-table" class="print-strong-border"></table>
	</div>
</body>

</html>
