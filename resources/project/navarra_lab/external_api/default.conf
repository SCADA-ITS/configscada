server {
    listen       80;
    server_name  localhost;

    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # Configuración del sitio principal
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Página de error personalizada para códigos 50x
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location = /apiopenits/elements/cameras {
		default_type application/json;  # Asegura que la respuesta sea JSON

		content_by_lua_block {

			local cjson = require "cjson"

			-- Crear el cuerpo JSON para la solicitud POST
			local data = {
			query = [[
				query {
				  getElementsByType(elementTypeId:"ElementType:2") {
					alias
					location{
						lat
						lon
						alias
						stretchs{
							alias
						}
					}
				  }
				}
				]]
				}
			local json_body = cjson.encode(data)

			-- Preparar el comando curl
			local curl_cmd = string.format([[
				curl -X POST http://10.253.5.83:8082/graphql \
				-H "Content-Type: application/json" \
				-d '%s'
			]], json_body)

			-- Ejecutar el comando curl y capturar la salida
			local handle = io.popen(curl_cmd)
			local response = handle:read("*a")
			handle:close()

			if not response then
				ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
				ngx.say(cjson.encode({ error = "Error obteniendo la respuesta del servidor" }))
				return
			end

			-- Decodificar la respuesta JSON para manipularla
			local decoded_response = cjson.decode(response)

			-- Filtrar el nodo `getElementsByType` y devolver solo su contenido
			local filtered_response = decoded_response.data and decoded_response.data.getElementsByType or {}

			-- Codificar nuevamente el JSON filtrado y devolverlo
			ngx.status = ngx.HTTP_OK
			ngx.header.content_type = "application/json"
			ngx.say(cjson.encode(filtered_response))
		}
	}
	
location = /apiopenits/elements/pmvs {
    default_type application/json;

    content_by_lua_block {
        local cjson = require "cjson"

        local data = {
            query = [[
                query {
                    getElementsByType(elementTypeId:"ElementType:71") {
                        alias
                        location {
                            lat
                            lon
                            alias
                            stretchs {
                                alias
                            }
                        }
                        elementValues {
                            elementTypeParam {
                                alias
                            }
                            value
                        }
                    }
                }
            ]]
        }

        local json_body = cjson.encode(data)

        local curl_cmd = string.format([[
            json='%s'
            curl -s -X POST http://10.253.5.83:8082/graphql \
            -H "Content-Type: application/json" \
            -d "$json"
        ]], json_body:gsub("'", "'\\''"))

        local handle = io.popen(curl_cmd)
        local response = handle:read("*a")
        handle:close()

        if not response then
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            ngx.say(cjson.encode({ error = "Error obteniendo la respuesta del servidor" }))
            return
        end

        ngx.log(ngx.ERR, "RESPUESTA CRUDA: ", response)

        local ok, decoded_response = pcall(cjson.decode, response)
        if not ok then
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            ngx.say(cjson.encode({ error = "Error al parsear JSON", raw = response }))
            return
        end

        local elements = decoded_response.data and decoded_response.data.getElementsByType or {}

        for _, element in ipairs(elements) do
            local new_values = {}
            for _, ev in ipairs(element.elementValues or {}) do
                if ev.elementTypeParam and ev.elementTypeParam.alias == "data_json" then
                    table.insert(new_values, {
                        alias = "signalling",
                        value = ev.value
                    })
                    break
                end
            end
            element.elementValues = new_values
        end

        ngx.status = ngx.HTTP_OK
        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(elements))
    }
}

	
