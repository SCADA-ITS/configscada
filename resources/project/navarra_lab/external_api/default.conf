  location = /apiopenits/incidents/location {
		default_type application/json;  # Asegura que la respuesta sea JSON

		content_by_lua_block {
			local cjson = require "cjson"

      -- Leer el cuerpo de la petición
      ngx.req.read_body()
      local body_data = ngx.req.get_body_data()

      if not body_data then
          ngx.status = ngx.HTTP_BAD_REQUEST
          ngx.say(cjson.encode({ error = "No request body found" }))
          return
      end

      local ok, client_data = pcall(cjson.decode, body_data)
      if not ok or not client_data.coordinates then
          ngx.status = ngx.HTTP_BAD_REQUEST
          ngx.say(cjson.encode({ error = "Invalid JSON or missing coordinates" }))
          return
      end

			-- Crear el cuerpo JSON para la solicitud POST
			local data = {
          coordinates = client_data.coordinates,
          instructions = false
      }
			local json_body = cjson.encode(data)

			-- Preparar el comando curl
			local curl_cmd = string.format([[
				curl -X POST http://10.253.5.81:8701/ors/v2/directions/driving-car/geojson \
				-H "Content-Type: application/json" \
				-d '%s'
			]], json_body)

			-- Ejecutar el comando curl y capturar la salida
			local handle = io.popen(curl_cmd)
			local response = handle:read("*a")
			handle:close()

			if not response then
				ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
				ngx.say(cjson.encode({ error = "Error obteniendo la respuesta del servidor" }))
				return
			end
			
			local ok, decoded = pcall(cjson.decode, response)
      if not ok then
          ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
          ngx.say(cjson.encode({ error = "Invalid JSON response" }))
          return
      end

      -- Extraer solo coordinates
      local coordinates = nil
      if decoded and decoded.features and #decoded.features > 0 then
          coordinates = decoded.features[1].geometry.coordinates
      end

      if not coordinates then
          ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
          ngx.say(cjson.encode({ error = "No coordinates found" }))
          return
      end

      -- Responder solo con el array de coordenadas
      ngx.status = ngx.HTTP_OK
      ngx.header.content_type = "application/json"
      ngx.say(cjson.encode(coordinates))
		}
	}
	
