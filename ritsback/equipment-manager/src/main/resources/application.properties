db_sync_measures.executor.insert_table_query=INSERT INTO rt.element_values (element_type_id, element_id, element_type_param_id, param_type_id, value, enabled, visible, created_at, updated_at) \
	SELECT e.element_type_id,  e.element_id, p.element_type_param_id, p.param_type_id, p.default_value, true, true, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP FROM conf.elements e \
		INNER JOIN master.element_type_params p \
			ON p.element_type_id = e.element_type_id WHERE p.durable = true \
	AND NOT EXISTS  (SELECT * FROM rt.element_values \
			WHERE element_type_id = e.element_type_id AND element_id = e.element_id AND element_type_param_id = p.element_type_param_id AND  param_type_id = p.param_type_id);
	
db_sync_measures.executor.undate_table_query=UPDATE rt.element_values SET element_value_state_id = ?, value = ?, updated_at = CURRENT_TIMESTAMP \
 	WHERE element_type_id=? AND element_type_param_id=? AND param_type_id=? AND element_id=?;
 	
