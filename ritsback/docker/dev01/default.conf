server {
    listen       80;
    server_name  localhost;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
    
    location /graphql {
	    auth_request /auth;
	    # set a variable value basing on the result of the subrequest with the auth_request_set directive
	    auth_request_set $auth_status $upstream_status;
	    # ... define rest of location ...
	    proxy_pass http://172.17.0.1:8082/graphql;
	}
	
	location = /login {
	    proxy_pass http://172.17.0.1:8190/api/v1/login;
	}
	
	location = /keepAlive {
	    proxy_pass http://172.17.0.1:8190/api/v1/keepAlive;
	}
	
	location = /logout {
	    proxy_pass http://172.17.0.1:8190/api/v1/logout;
	}
	
	location = /auth {
	    proxy_pass http://172.17.0.1:8190/api/v1/auth;
	    proxy_pass_request_body off;
	    proxy_set_header Content-Length "";
	    # Pass the full original request URI with arguments with the proxy_set_header directive:
	    proxy_set_header X-Original-URI $request_uri;
	    #proxy_set_header X-Required-Role "superuser";
	    #proxy_set_header WWW-Authenticate "Basic realm=\"my realm\"";
	    
	}
}
