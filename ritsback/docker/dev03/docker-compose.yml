version: '3'
services:

  timescaledb:
    image: timescale/timescaledb:latest-pg12
    ports:
      - "5430:5432"
    environment:
      - POSTGRES_USER=rits
      - POSTGRES_PASSWORD=rits
    volumes:
      - ./timescaledb:/var/lib/postgresql/data
      
