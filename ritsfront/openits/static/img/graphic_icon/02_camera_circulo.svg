<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="55mm" height="55mm" viewBox="0 0 55 55" version="1.1" id="svg2">
  <title>Cámara fija — estado modificable</title>
  <desc>Pictograma basado en la referencia. El SCADA puede modificar el atributo fill del círculo con id state.</desc>
  <g id="pictogram" fill="none" stroke="#ea0a2a" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
    <!-- Carcasa lateral abierta en el extremo del objetivo -->
    <path d="M49.1 17.6 L12.7 6.6 Q11.1 6.1 10.6 7.7 L6.5 20.5 Q6 22.1 7.6 22.6 L38.5 31.9 Q40.1 32.4 40.6 30.8 L42.5 24.4"/>
    <!-- Separación del objetivo -->
    <path d="M35.7 22.4 L33.2 30.3"/>
    <!-- Brazo y anclaje de pared -->
    <path d="M25 27.8 L21.1 41.6 H8.1"/>
    <path d="M8.1 35.2 V48.2"/>
  </g>
  <!-- Único relleno de estado: conservar este id en la integración SCADA. -->
  <circle id="state" cx="49.1" cy="17.6" r="2.8" fill="#ffcc00" stroke="none"/>
</svg>
