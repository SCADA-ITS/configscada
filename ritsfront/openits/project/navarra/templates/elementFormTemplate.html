<!DOCTYPE html>
<html>

<head>
    <script src="./lib/webix/webix.js" type="text/javascript"></script>
    <script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
    <script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
    <script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
    <script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

    <link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

    <script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

    <script type="text/javascript" src="./data/config.js"></script>
    <script type="text/javascript" src="./data/constants.js"></script>

    <style>
        body {
            font-family: Roboto;
            padding-left: 15px;
            padding-right: 15px;
        }

        .print-template-header {
            width: 90%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            padding-bottom: 15px;
        }

        .print-template-logo {
            width: 20%;
            flex-direction: row;
        }

        .print-parte-number {
            height: 50px;
            font-style: italic;
            display: inherit;
            align-items: center;
            border: 1px solid var(--global-grey);
            background-color: var(--global-grey);
        }

        .print-separators {
            font-family: Roboto;
            font-size: 14px;
            font-style: italic;
            font-weight: bold;
            color: var(--blue-text-default);
        }

        #content {
            width: 90%;
        }

        .date-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Permite que los elementos se envuelvan si no hay suficiente espacio */
        }
		.custom-data-container {
		    margin-top: 20px;
    		display: flex;
    		flex-direction: column;
		}

		.custom-data-container h2 {
    		margin-bottom: 5px;
		}

		.custom-data-container .data-value {
    		margin-top: 5px;
		}

        h2 {
            font-style: italic;
            font-size: 14px;
        }

        #groupImage div img{
            width: 300px;
            height: 300px;
        }

        /* Estilos específicos para los datos del vehículo */
        .vehicle-data {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .vehicle-data > div {
            flex: 1; /* Los elementos ocuparán todo el ancho disponible */
            margin-bottom: 10px; /* Espaciado entre cada línea */
        }

        .vehicle-data h2 {
            margin-bottom: 20px; /* Espaciado entre título y dato */
        }
    </style>
</head>

<body>
    <div id="template" class="print-template">
        <div class="print-template-header">
            <h1>Informe</h1>
            <img class="print-template-logo" src="./img/logo-project.svg">
        </div>

        <div style="height: 30px; text-align: left; font-size: 14px;">
            <h1 class="print-parte-number">Número de informe: <span id="field.id"></span></h1>
        </div>
        <div id="content">
            <div style="margin-top: 50px;">
                <span class="print-separators">Fecha de creación</span>
                <hr>
            </div>
			<div class="custom-data-container">
				<h2>Fecha:</h2>
				<div class="data-value"><span id="field.fecha"></span></div>
			</div>					
            <div style="margin-top: 50px;">
                <span class="print-separators">Datos conductor</span>
                <hr>
            </div>
			<div class="custom-data-container">
				<h2>Nombre:</h2>
				<div class="data-value"><span id="field.conductor"></span></div>
			</div>
            <div style="margin-top: 50px;">
                <span class="print-separators">Datos del vehiculo</span>
                <hr>
            </div>
            <div class="vehicle-data">
                <div>
                    <h2>Marca:</h2>
                    <div><span id="field.marca_vehiculo"></span></div>
                </div>
                <div>
                    <h2>Modelo:</h2>
                    <div><span id="field.modelo_vehiculo"></span></div>
                </div>
                <div>
                    <h2>Matricula:</h2>
                    <div><span id="field.matricula"></span></div>
                </div>
                <div>
                    <h2>Categoria:</h2>
                    <div><span id="field.categoria_vehiculo"></span></div>
                </div>
                <div>
                    <h2>Nacionalidad:</h2>
                    <div><span id="field.nacionalidad_vehiculo"></span></div>
                </div>
                <div>
                    <h2>Itv:</h2>
                    <div><span id="field.itv"></span></div>
                </div>
                <div>
                    <h2>Seguro:</h2>
                    <div><span id="field.seguro"></span></div>
                </div>
            </div>
            <div style="margin-top: 50px;" class="date-container">
                <h2>Imagenes de evidencias:</h2>
            </div>
            <div style="margin-top: 30px;" id="groupImage"></div>
        </div>
    </div>
</body>

</html>
