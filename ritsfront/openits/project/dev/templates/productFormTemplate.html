<!DOCTYPE html>

<html>

<head>
	<script src="./lib/webix/webix.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

	<link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

	<script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

	<script type="text/javascript" src="./data/config.js"></script>
	<script type="text/javascript" src="./data/constants.js"></script>

	<style>
		.print-template {
			padding: 5px;
		}

		.print-template-header {
			width: 90%;
			box-sizing: border-box;
			display: flex;
			justify-content: space-between;
		}

		.print-template-logo {
			width: 20%;
			flex-direction: row;
		}

		.print-data {
			width: 90%;
			padding: inherit;
		}

		.print-user-data {
			display: flex;
			justify-content: space-between;
		}

		.print-section {
			margin: 50px 5px;
		}

		.print-separators {
			font-family: Roboto;
			font-size: 12px;
			font-style: italic;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts {
			width: 100%;
			font-family: Roboto;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts h2 {
			font-style: italic;
			font-size: 14px;
		}

		.print-texts span {
			font-size: 18px;
		}

		.print-id-number {
			height: 50px;
			padding-left: 10px;
			font-style: italic;
			display: inherit;
			align-items: center;
			border: 1px solid var(--global-grey);
			background-color: var(--global-grey);
		}

		.id-block {
			border: 1px solid rgb(218, 222, 224);
			border-top: none;
		}

		table {
			padding: inherit;
			font-family: monospace;
			overflow: hidden;
			table-layout: fixed;
			border-collapse: collapse !important;
			min-width: 435px;
			margin: 15px;
			border: 1px solid rgb(218, 222, 224);
		}

		th {
			height: 34px;
			text-align: left;
			background-color: var(--blue-backcolor);
			border-right-color: transparent;
			border-left-color: transparent;
		}

		tr th td p {
			height: 34px;
			overflow: hidden;
		}

		caption {
			padding: 10px;
		}

		.print-list {
			border: none;
		}

		.print-list th {
			display: none;
		}

		.print-list caption {
			text-align: left;
		}

		.print-list tr td p {
			height: 10px !important;
		}
	</style>
</head>

<body>
	<div id="template" class="print-template">

		<div class="print-template-header">
			<h1>Stock</h1>
			<img class="print-template-logo" src="./img/logo-project.svg">
		</div>

		<div class="id-block">
			<div style="height: 50px;">
				<h2 class="print-id-number">Id: <span id="field.category_id"></span></h2>
			</div>

			<div class="print-data">
				<section class="print-section">
					<div>
						<span class="print-separators">Datos de Producto</span>
						<hr>
					</div>
					<div class="print-user-data">
						<div class="print-texts">
							<h2>Producto:</h2>
							<span id="field.product_name"></span>
						</div>
						<div class="print-texts">
							<h2>Subcategoria:</h2>
							<span id="field.subcategory_id"></span>
						</div>
					</div>
				</section>

				<section class="print-section">
					<div>
						<span class="print-separators">Disponibilidad</span>
						<hr>
					</div>
					<div class="print-user-data">

						<div class="print-texts">
							<h2>Stock:</h2>
							<span id="field.stock"></span>
						</div>

						<div class="print-texts">
							<h2>Precio:</h2>
							<span id="field.price"></span>
						</div>

					</div>
				</section>

			</div>

		</div>

	</div>
</body>

</html>
