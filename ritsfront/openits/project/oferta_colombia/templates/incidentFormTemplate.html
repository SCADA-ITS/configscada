<!DOCTYPE html>

<html>

<head>
	<script src="./lib/webix/webix.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

	<link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

	<script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

	<script type="text/javascript" src="./data/config.js"></script>
	<script type="text/javascript" src="./data/constants.js"></script>

	<style>
		.print-template {
			padding: 5px;
		}

		.print-template-header {
			width: 90%;
			box-sizing: border-box;
			display: flex;
			justify-content: space-between;
		}

		.print-template-logo {
			width: 20%;
			flex-direction: row;
		}

		.print-data {
			width: 90%;
			padding: inherit;
		}

		.print-user-data {
			display: flex;
			justify-content: space-between;
		}

		.print-section {
			margin: 50px 5px;
		}

		.print-separators {
			font-family: Roboto;
			font-size: 12px;
			font-style: italic;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts {
			width: 100%;
			font-family: Roboto;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts h2 {
			font-style: italic;
			font-size: 14px;
		}

		.print-texts span {
			font-size: 18px;
		}

		.print-incident-number {
			height: 50px;
			padding-left: 10px;
			font-style: italic;
			display: inherit;
			align-items: center;
			border: 1px solid var(--global-grey);
			background-color: var(--global-grey);
		}
		
		.incident-block {
			border: 1px solid rgb(218, 222, 224);
			border-top: none;			
		}

		table {
			padding: inherit;
			font-family: monospace;
			overflow: hidden;
			table-layout: fixed;
			border-collapse: collapse !important;
			min-width: 435px;
			margin: 15px;
			border: 1px solid rgb(218, 222, 224);
		}

		th {
			height: 34px;
			text-align: left;
			background-color: var(--blue-backcolor);
			border-right-color: transparent;
			border-left-color: transparent;
		}

		tr th td p {
			height: 34px;
			overflow: hidden;
		}

		caption {
			padding: 10px;

		}

		.print-list {
			border: none;
		}

		.print-list th {
			display: none;
		}

		.print-list caption {
			text-align: left;
		}

		.print-list tr td p {
			height: 10px !important;
		}
	</style>
</head>

<body>
	<div id="template" class="print-template">

		<div class="print-template-header">
			<h1>Informe de incidencia</h1>
			<img class="print-template-logo" src="./img/logo-project.svg">
		</div>
		
		<div class="incident-block">
			<div style="height: 50px;">
				<h2 class="print-incident-number">Número de incidencia: <span id="field.incident_report_id"></span></h2>
			</div>

			<div class="print-data">
				<section class="print-section">
					<div>
						<span class="print-separators">Datos del usuario</span>
						<hr>
					</div>
					<div class="print-user-data">
						<div class="print-texts">
							<h2>Usuario:</h2>
							<span id="field.user_n"></span>
						</div>
						<div class="print-texts">
							<h2>Teléfono:</h2>
							<span id="field.phone"></span>
						</div>
					</div>
				</section>

				<section class="print-section">
					<div>
						<span class="print-separators">Datos del evento</span>
						<hr>
					</div>
					<div class="print-user-data">

						<div class="print-texts">
							<h2>Localización:</h2>
							<span id="field.location"></span>
						</div>

						<div class="print-texts">
							<h2>Tipo:</h2>
							<span id="field.incident_type"></span>
						</div>

						<div class="print-texts">
							<h2>Subtipo:</h2>
							<span id="field.incident_sub_type"></span>
						</div>

						<div class="print-texts">
							<h2>Gravedad:</h2>
							<span id="field.level"></span>
						</div>

					</div>
				</section>

				<section class="print-section">
					<div>
						<span class="print-separators">Datos del equipo</span>
						<hr>
					</div>
					<div class="print-user-data">

						<div class="print-texts">
							<h2>Tipo:</h2>
							<span id="field.element_id"></span>
						</div>

						<div class="print-texts">
							<h2>Origen:</h2>
							<span id="field.source_id"></span>
						</div>

						<div class="print-texts">
							<h2>Detección:</h2>
							<span id="field.type_detection"></span>
						</div>

					</div>
				</section>

			</div>

		</div>

		<table id="field.assigned_pdas">
			<tr>
				<th id="field.assigned_pdas.id"></th>
				<th id="field.assigned_pdas.pda_id"></th>
			</tr>
		</table>

		<table id="field.interrupt_agents" class="print-list">
			<tr>
				<th id="field.interrupt_agents.id"></th>
				<th id="field.interrupt_agents.comment"></th>
				<th id="field.interrupt_agents.agents_id"></th>
			</tr>
		</table>
	</div>
</body>

</html>
