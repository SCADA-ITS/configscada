<!DOCTYPE html>

<html>

<head>
	<script src="./lib/webix/webix.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

	<link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

	<script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

	<script type="text/javascript" src="./data/config.js"></script>
	<script type="text/javascript" src="./data/constants.js"></script>

	<style>
		.print-template {
			padding: 5px;
		}

		.print-template-header {
			width: 90%;
			box-sizing: border-box;
			display: flex;
			justify-content: space-between;
		}

		.print-template-logo {
			width: 20%;
			flex-direction: row;
		}

		.print-data {
			width: 90%;
			padding: inherit;
		}

		.print-user-data {
			display: flex;
			justify-content: space-between;
		}

		.print-section {
			margin: 40px 5px;
		}

		.print-separators {
			font-family: Roboto;
			font-size: 14px;
			font-style: italic;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts {
			width: 100%;
			font-family: Roboto;
			font-weight: bold;
			color: var(--blue-text-default);
		}

		.print-texts h2 {
			font-style: italic;
			font-size: 14px;
		}

		.print-texts span {
			font-size: 18px;
		}

		.print-parte-number {
			height: 50px;
			padding-left: 10px;
			font-style: italic;
			display: inherit;
			align-items: center;
			border: 1px solid var(--global-grey);
			background-color: var(--global-grey);
		}
		
		#groupImage div img{
            width: 200px;
            height: 200px;
        }
		
	</style>
</head>

<body>
	<div id="template" class="print-template">

		<div class="print-template-header">
			<h1>Parte de trabajo</h1>
			<img class="print-template-logo" src="./img/logo-project.svg">
		</div>
		
		<div class="parte-block">
			<div style="height: 30px;">
				<h2 class="print-parte-number">Número de parte: <span id="field.id"></span></h2>
			</div>

			<div class="print-data">
				<section class="print-section">
					<div>
						<span class="print-separators">Tiempo de trabajo</span>
						<hr>
					</div>
					<div class="print-user-data">
						<div class="print-texts">
							<h2>Fecha inicio:</h2>
							<span id="field.arrival_date"></span>
						</div>
						<div class="print-texts">
							<h2>Fecha fin:</h2>
							<span id="field.release_date"></span>
						</div>						
				</section>
				<section class="print-section">
					<div>
						<span class="print-separators">Datos del usuario</span>
						<hr>
					</div>
					<div class="print-user-data">
						<div class="print-texts">
							<h2>Operario:</h2>
							<span id="field.users_names"></span>
						</div>
				</section>

				<section class="print-section">
					<div>
						<span class="print-separators">Datos del equipo</span>
						<hr>
					</div>
					<div class="print-user-data">

						<!--<div class="print-texts">
							<h2>Tipo:</h2>
							<span id="field.element_type_id"></span>
						</div>-->

						<div class="print-texts">
							<h2>Equipo:</h2>
							<span id="field.elements_id"></span>
						</div>
						<!--<div class="print-texts">
							<h2>Localización:</h2>
							<span id="field.location_id"></span>
						</div>-->

					</div>
				</section>
				<section class="print-section">
					<div>
						<span class="print-separators">Datos de trabajo</span>
						<hr>
					</div>
					<div class="print-user-data">

						<div class="print-texts">
							<h2>Causa:</h2>
							<span id="field.cause_id"></span>
						</div>

						<div class="print-texts">
							<h2>Acción:</h2>
							<span id="field.action_id"></span>
						</div>
						<div class="print-texts">
							<h2>Impacto en la vía:</h2>
							<span id="field.road_imapcts_id"></span>
						</div>

					</div>
				</section>
				<section class="print-section">
					<div class="print-user-data">
						
						<div class="print-texts">
							<h2>Commentarios:</h2>
							<span id="field.comments"></span>
	
						</div>
					</div>
				</section>


				<h2>Imagenes de evidencias:</h2>
				<div id="groupImage"></div>

			</div>

		</div>
	</div>
</body>

</html>
