<!DOCTYPE html>

<html>

<head>
	<script src="./lib/webix/webix.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-ES.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/es-CL.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/en-GB.js" type="text/javascript"></script>
	<script src="./lib/webix/webix-locales-pro/sk-SK.js" type="text/javascript"></script>

	<link href="./lib/materialicons/css/materialicons.css" rel="stylesheet">

	<script type="text/javascript" src="./lib/jquery/jquery-3.4.1.min.js"></script>

	<script type="text/javascript" src="./data/config.js"></script>
	<script type="text/javascript" src="./data/constants.js"></script>

	<style>
		body {
			font-family: Roboto;
			padding-left: 15px;
			padding-right: 15px;
		}

		.print-template-header {
			width: 90%;
			box-sizing: border-box;
			display: flex;
			justify-content: space-between;
			padding-bottom: 15px;
		}

		.print-template-logo {
			width: 20%;
			flex-direction: row;
		}

		.print-parte-number {
			height: 50px;
			font-style: italic;
			display: inherit;
			align-items: center;
			border: 1px solid var(--global-grey);
			background-color: var(--global-grey);
		}

		.print-separators {
			font-family: Roboto;
			font-size: 14px;
			font-style: italic;
			font-weight: bold;
			color: var(--blue-text-default);
		}
        #content {
            width: 90%;
        }

        .date-container {
            display: flex;
			justify-content: space-between;
		}

		h2 {
			font-style: italic;
			font-size: 14px;
		}

        #comments-container {
            border: 1px solid #ccc;
            width: 500px; /* Ancho deseado */
            height: 80px; /* Alto deseado */
            margin-bottom: 50px; /* Añade un margen inferior */       
		}

		#groupImage div img{
            width: 200px;
            height: 200px;
        }
	</style>
</head>

<body>
	<div id="template" class="print-template">
		<div class="print-template-header">
			<h1>Parte de trabajo</h1>
			<img class="print-template-logo" src="./img/logo-project.svg">
		</div>

		<div style="height: 30px; text-align: left; font-size: 14px;">
			<h1 class="print-parte-number">Número de parte: <span id="field.id"></span></h1>
		</div>
	</div>
	<div id="content">
		<div style="margin-top: 50px;">
			<span class="print-separators">Tiempo de trabajo</span>
			<hr>
		</div>
		<div style="height: 30px;" class="date-container">
			<h2>Fecha inicio:</h2>
			<span style="margin-top: 10px;" id="field.arrival_date"></span>
			<h2>Fecha fin:</h2>
			<span style="margin-top: 10px;" id="field.release_date"></span>	
		</div>
		<div style="margin-top: 50px;">
			<span class="print-separators">Datos del operario</span>
			<hr>
		</div>
		<div style="height: 30px; width: 400px;" class="date-container">
			<h2>Operario:</h2>
			<span style="margin-top: 10px; " id="field.users_names"></span>	
		</div>
		<div style="margin-top: 50px;">
			<span style="margin-top: 10px;" class="print-separators">Datos del equipo</span>
			<hr>
		</div>
		<div style="height: 30px; width: 400px;" class="date-container">
			<h2>Equipo:</h2>
			<span style="margin-top: 10px;" id="field.elements_id"></span>	
		</div>

		<div style="margin-top: 50px;">
			<span class="print-separators">Datos de trabajo</span>
			<hr>
		</div>
		<div style="height: 30px;" class="date-container">
			<h2>Causa:</h2>
			<span style="margin-top: 10px;" id="field.cause_id"></span>
			<h2>Acción:</h2>
			<span style="margin-top: 10px;" id="field.action_id"></span>
			<h2>Impacto en la vía:</h2>
			<span style="margin-top: 10px;" id="field.road_imapcts_id"></span>
		</div>
        <div style="height: 30px; margin-top: 50px; justify-content: left" class="date-container">
            <h2>Comentarios:</h2>
            <div style="margin-top: 10px;"id="comments-container">
                <span id="field.comments"></span>
            </div>
        </div>
		<div style="margin-top: 80px;" class="date-container">
            <h2>Imagenes de evidencias:</h2>
		</div>
		<div style="margin-top: 30px;" id="groupImage"></div>
	</div>

</body>

</html>
