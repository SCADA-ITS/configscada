version: '2'

services:
  tomcat:
    image: 'bitnami/tomcat:9.0'
    user: root
    ports:
      - '8080:8080'
    volumes:
      - ./tomcat/conf/server.xml:/opt/bitnami/tomcat/conf/server.xml
      - ./tomcat/webapps:/bitnami/tomcat/data

    environment:
      - TOMCAT_ALLOW_REMOTE_MANAGEMENT=1
      - TOMCAT_USERNAME=admin
      - TOMCAT_PASSWORD=admin
