name: config_plans
description: Configurador de planes
host: EXCEL
api_set: {}
script:
  content: |
    $("#run").click(() => tryCatch(run));
    $("#validate").click(() => tryCatch(validate));

    const LINE_BREAK = "\n";
    const COMMAND_ORDER_TABLE_EQUIP = "EQUIPO";
    const COMMAND_ORDER_TABLE_ACTION = "ACCION";
    const COMMAND_ORDER_TABLE_COMMAND = "COMMAND";

    const INITIAL_PLAN_ID = "initialPlanId";
    const INITIAL_COMMAND_ELEMENT_ID = "initialElementId";
    const INITIAL_SHEETS = "initialSheets";

    const PLAN_ORDER_TYPE_ID_WAIT= 5;

    this.elementsByTypeMap;
    this.commandOrders;
    this.plansConfigArray = [];

    this.plansDao = [];
    this.planNodesDao = [];
    this.planNodeHirarchiesDao = [];
    this.commandElementsDao = [];
    this.commandElementValuesDao = [];
    this.planOrdersDao = [];
    this.planOrderValuesDao = [];
    this.planOrderCommandElementsDao = [];

    async function run() {
      clean();

      if (!this.elementsByTypeMap) {
        webix.message({ type: "error", text: "Cargue la carpeta Properties" });
        alert("Cargue la carpeta Properties");
      } else {
        await loadCommandOrders();
        await loadDataSheets();
        let planId = document.getElementById(INITIAL_PLAN_ID).value;
        let planNodeId = 1;
        let commandElementId = document.getElementById(INITIAL_COMMAND_ELEMENT_ID).value;
        let planOrderId = 1;
        let planOrderOrder = 1;
        let lastPlan;
        let lastNode;
        for (let i = 0; i < this.plansConfigArray.length; i++) {
          // PlanNodes
          let planNode = new PlanNode();
          if (!lastNode || lastNode.alias != this.plansConfigArray[i].plan) {
            planNode.nodeId = planNodeId++;
            planNode.alias = this.plansConfigArray[i].plan;
            planNode.description = this.plansConfigArray[i].plan;
            lastNode = planNode;
          }

          // Plans
          if (this.plansConfigArray[i].elementTypeId && typeof this.plansConfigArray[i].elementTypeId == "number") {
            let plan = new Plan();
            if (!lastPlan || lastPlan != this.plansConfigArray[i].plan) {
              planId++;
              plan.planId = planId;
              plan.alias = this.plansConfigArray[i].plan;
              plan.description = null;
              this.plansDao.push(plan);
              lastPlan = this.plansConfigArray[i].plan;
              planOrderId = 1;
              planOrderOrder = 1;
            }
            planNode.planId = planId;

            let elementsByIdElement = [];
            if (
              !this.plansConfigArray[i].idElement ||
              !this.plansConfigArray[i].idElement.toString().trim() ||
              this.plansConfigArray[i].idElement == "*"
            ) {
              elementsByIdElement = this.elementsByTypeMap[this.plansConfigArray[i].elementTypeId].filter((x) => x.item);
            } else {
              let idElements = getNumbers(this.plansConfigArray[i].idElement);
              elementsByIdElement = this.elementsByTypeMap[this.plansConfigArray[i].elementTypeId].filter(
                (x) => x.item && idElements.includes(parseInt(x.item))
              );
            }

            await elementsByIdElement.forEach((element) => {
              //planOrders
              let planOrder = new PlanOrder();
              planOrder.planId = planId;
              planOrder.planOrderId = planOrderId++;
              planOrder.planOrderOrder = planOrderOrder++;
              let commandOrder = this.commandOrders.filter(
                (x) =>
                  x[COMMAND_ORDER_TABLE_EQUIP] == this.plansConfigArray[i].elementTypeId &&
                  x[COMMAND_ORDER_TABLE_COMMAND] == this.plansConfigArray[i].command
              );
              if (commandOrder && commandOrder.length > 0) {
                planOrder.alias = commandOrder[0][COMMAND_ORDER_TABLE_ACTION] + " " + element.alias;
                planOrder.description = commandOrder[0][COMMAND_ORDER_TABLE_ACTION] + " " + element.alias;
              } else {
                console.error(
                  "Error configurando equipos de tipo " +
                    this.plansConfigArray[i].elementTypeId +
                    " y comando " +
                    this.plansConfigArray[i].command
                );
              }
              //console.log(commandOrder);
              this.planOrdersDao.push(planOrder);

              // commandElement
              let commandElement = new CommandElement();
              commandElement.commandElementTypeId = this.plansConfigArray[i].command;
              commandElement.elementTypeId = this.plansConfigArray[i].elementTypeId;
              commandElement.commandElementId = commandElementId++;
              commandElement.elementId = element.item;
              this.commandElementsDao.push(commandElement);

              // commandElementValues
              if (this.plansConfigArray[i].value) {
                let commandElementValue = new CommandElementValue();
                commandElementValue.commandElementTypeId = this.plansConfigArray[i].command;
                commandElementValue.elementTypeId = this.plansConfigArray[i].elementTypeId;
                commandElementValue.commandElementId = commandElement.commandElementId;
                commandElementValue.value = this.plansConfigArray[i].value;
                this.commandElementValuesDao.push(commandElementValue);
              }

              // planOrderCommandElements
              let planOrderCommandElement = new PlanOrderCommandElement();
              planOrderCommandElement.commandElementTypeId = this.plansConfigArray[i].command;
              planOrderCommandElement.elementTypeId = this.plansConfigArray[i].elementTypeId;
              planOrderCommandElement.commandElementId = commandElement.commandElementId;
              planOrderCommandElement.planId = planId;
              planOrderCommandElement.planOrderId = planOrder.planOrderId;
              this.planOrderCommandElementsDao.push(planOrderCommandElement);
            });
          } else if (this.plansConfigArray[i].command == -1){

            //planOrders
            let planOrder = new PlanOrder();
            planOrder.planId = planId;
            planOrder.planOrderId = planOrderId++;
            planOrder.planOrderOrder = planOrderOrder++;
            planOrder.planOrderTypeId = PLAN_ORDER_TYPE_ID_WAIT;
            planOrder.alias = "Wait " + this.plansConfigArray[i].value + " seconds";
            planOrder.description = "Wait " + this.plansConfigArray[i].value + " seconds";
            this.planOrdersDao.push(planOrder);

            //planOrderValues
            let planOrderValue = new PlanOrderValue();
            planOrderValue.planId = planOrder.planId;
            planOrderValue.planOrderId = planOrder.planOrderId;
            planOrderValue.planOrderTypeId = PLAN_ORDER_TYPE_ID_WAIT;
            planOrderValue.planOrderTypeParamId = 1;
            planOrderValue.value = this.plansConfigArray[i].value;
            this.planOrderValuesDao.push(planOrderValue);
          }

          if (planNode && planNode.nodeId) {
            this.planNodesDao.push(planNode);
          }

          // planNodeHirarchies
          if (this.plansConfigArray[i].parent && this.plansConfigArray[i].parent.trim() && planNode && planNode.nodeId) {
            let parentNodeArray = this.planNodesDao.filter(
              (x) => x.alias == this.plansConfigArray[i].parent && x.nodeId < planNode.nodeId
            );
            let parentNode = parentNodeArray[parentNodeArray.length - 1];
            let planNodeHirarchy = new PlanNodeHirarchy();
            planNodeHirarchy.nodeParentId = parentNode.nodeId;
            planNodeHirarchy.nodeChildId = planNode.nodeId;
            this.planNodeHirarchiesDao.push(planNodeHirarchy);
          }
        }

        // Export File
        let outputFileText = Plan.insertHeader();
        this.plansDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        outputFileText += PlanNode.insertHeader();
        this.planNodesDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        outputFileText += PlanNodeHirarchy.insertHeader();
        this.planNodeHirarchiesDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        outputFileText += CommandElement.insertHeader();
        this.commandElementsDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        outputFileText += CommandElementValue.insertHeader();
        this.commandElementValuesDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        outputFileText += PlanOrder.insertHeader();
        this.planOrdersDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        if (this.planOrderValuesDao && this.planOrderValuesDao.length > 0){
          outputFileText += PlanOrderValue.insertHeader();
          this.planOrderValuesDao.forEach((dao) => {
            outputFileText += dao.insertRow();
          });
          outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;
        }

        outputFileText += PlanOrderCommandElement.insertHeader();
        this.planOrderCommandElementsDao.forEach((dao) => {
          outputFileText += dao.insertRow();
        });
        outputFileText = outputFileText.slice(0, -2) + ";" + LINE_BREAK + LINE_BREAK;

        var domElement = document.createElement("a");
        domElement.setAttribute("href", "data:text/plain;charset=utf-8," + encodeURIComponent(outputFileText));
        domElement.setAttribute("download", "export.sql");
        domElement.style.display = "none";
        document.body.appendChild(domElement);
        domElement.click();
        document.body.removeChild(domElement);
      }
    }

    async function validate() {
      clean();

      if (!this.elementsByTypeMap) {
        webix.message({ type: "error", text: "Cargue la carpeta Properties" });
        alert("Cargue la carpeta Properties");
      } else {
        paintSheets();
      }
    }

    function getNumbers(stringNumbers) {
      var nums = [];
      stringNumbers = stringNumbers.toString();
      var entries = stringNumbers.split(",");
      var length = entries.length;

      var i, entry, low, high, range;

      for (i = 0; i < length; i++) {
        entry = entries[i];
        if (!~entry.indexOf("-")) {
          nums.push(+entry);
        } else {
          range = entry.split("-");
          low = +range[0];
          high = +range[1];

          if (high < low) {
            low = low ^ high;
            high = low ^ high;
            low = low ^ high;
          }

          while (low <= high) {
            nums.push(low++);
          }
        }
      }

      return nums.sort(function(a, b) {
        return a - b;
      });
    }

    /** Default helper for invoking an action and handling errors. */
    async function tryCatch(callback) {
      try {
        await callback();
      } catch (error) {
        // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
        console.error(error);
      }
    }

    async function loadCommandOrders() {
      await Excel.run(async (context) => {
        let sheets = context.workbook.worksheets;
        sheets.load("items/name");
        await context.sync();
        let sheet = sheets.items[1];
        let tables = sheet.tables;
        tables.load("values");
        await context.sync();
        if (tables.count == 0) {
          this.commandOrders = [];
          let range = sheet.getUsedRange();
          range.load("values");
          await context.sync();
          let lastEquip;
          for (let i = 0; i < range.values.length; i++) {
            for (let j = 0; j < range.values[i].length; j++) {
              if (j == 0) {
                if (!lastEquip || range.values[i][j]) {
                  lastEquip = range.values[i][j];
                } else {
                  range.values[i][j] = lastEquip;
                }
              }
            }
          }
          this.commandOrders = tableToJson(range.values);
        } else {
          console.warn("Quite el formato tabla de la pestaña " + sheet.name);
        }
      });
    }

    async function loadDataSheets() {
      await Excel.run(async (context) => {
        this.plansConfigArray = [];
        let sheets = context.workbook.worksheets;
        sheets.load("items/name");
        await context.sync();
        let initialSheets;
        initialSheets = getNumbers(document.getElementById(INITIAL_SHEETS).value);
        for (let i = 0; i < sheets.items.length; i++) {
          if (initialSheets.includes(i)) {
            let dataSheet = sheets.items[i];
            let tableRange = dataSheet.tables.getItemAt(0).getRange();
            tableRange.load("values");
            await context.sync();
            this.plansConfigArray = this.plansConfigArray.concat(tableToJson(tableRange.values));
            //Order plans
            let planConfigMap = new Map();
            for (let planConfig of this.plansConfigArray) {
              if (!planConfigMap.get(planConfig.plan)) {
                planConfigMap.set(planConfig.plan, []);
              }
              planConfigMap.get(planConfig.plan).push(planConfig);
            }
            this.plansConfigArray = [];
            await planConfigMap.forEach(function(value, key) {
              //console.log(value);
              for (let item of value) {
                this.plansConfigArray.push(item);
              }
            });
          }
        }
      });
    }

    async function paintSheets() {
      await Excel.run(async (context) => {
        let sheets = context.workbook.worksheets;
        sheets.load("items/name");
        await context.sync();
        let initialSheets;
        initialSheets = getNumbers(document.getElementById(INITIAL_SHEETS).value);
        for (let i = 0; i < sheets.items.length; i++) {
          if (initialSheets.includes(i)) {
            let sheet = sheets.items[i];
            let table = sheet.tables.getItemAt(0);
            let tableRange = sheet.tables.getItemAt(0).getRange();
            tableRange.load("values");
            await context.sync();

            let dataTable = this.plansConfigArray.concat(tableToJson(tableRange.values));
            let newColumn = [["alias"]];
            await dataTable.forEach((data) => {
              let newColumnValue = "";

              if (data.elementTypeId && typeof data.elementTypeId == "number") {
                let elementsByIdElement = [];
                if (!data.idElement || !data.idElement.toString().trim() || data.idElement == "*") {
                  elementsByIdElement = this.elementsByTypeMap[data.elementTypeId].filter((x) => x.item);
                } else {
                  let idElements = getNumbers(data.idElement);
                  elementsByIdElement = this.elementsByTypeMap[data.elementTypeId].filter(
                    (x) => x.item && idElements.includes(parseInt(x.item))
                  );
                }
                elementsByIdElement.forEach((element) => {
                  newColumnValue += element.alias + ";";
                });
              }
              newColumn.push([newColumnValue]);
            });

            table.columns.add(null, newColumn);
            sheet.getUsedRange().format.autofitColumns();
            sheet.getUsedRange().format.autofitRows();
            await context.sync();
          }
        }
      });
    }

    // Returns array json from Xls values table
    function tableToJson(values) {
      let objectArray = [];
      let objectKeys = [];
      for (let i = 0; i < values.length; i++) {
        if (i === 0) {
          objectKeys = values[i];
          continue;
        }

        // Primer registro es pk, si no existe no inserta
        if (values[i][0]) {
          let element = {};
          for (let j = 0; j < values[i].length; j++) {
            element[objectKeys[j]] = values[i][j];
          }
          objectArray.push(element);
        }
      }

      return objectArray;
    }

    // Drop elements folder *script/properties*
    var dropZone = document.getElementById("drop_zone");
    dropZone.addEventListener("dragover", handleDragOver, false);
    dropZone.addEventListener("drop", handleFileSelect, false);

    function handleDragOver(evt) {
      evt.stopPropagation();
      evt.preventDefault();
      evt.dataTransfer.dropEffect = "copy";
    }

    function handleFileSelect(event) {
      event.stopPropagation();
      event.preventDefault();

      if (event.dataTransfer && event.dataTransfer.items) {
        var items = event.dataTransfer.items;
        for (var i = 0; i < items.length; i++) {
          var item = items[i].webkitGetAsEntry();
          if (item) {
            addDirectory(item, null);
          }
        }
        return;
      }

      function addDirectory(item, parent) {
        var _this = this;
        if (item.isDirectory) {
          var directoryReader = item.createReader();
          directoryReader.readEntries(function(entries) {
            entries.forEach(function(entry) {
              addDirectory(entry, item);
            });
          });
        } else {
          item.file((f) => {
            if (parent.name.includes("Type") && f.name == "element_values.csv") {
              console.log(f.name + (parent ? " parent: " + parent.name : ""));
              var fr = new FileReader();
              fr.onload = () => {
                if (!this.elementsByTypeMap) {
                  this.elementsByTypeMap = {};
                }
                this.elementsByTypeMap[parseInt(parent.name.split(" ")[1]) + ""] = csvToJson(fr.result);
              };
              fr.readAsText(f);
            }
          });
        }
      }
    }

    function clean() {
      this.plansDao = [];
      this.planNodesDao = [];
      this.planNodeHirarchiesDao = [];
      this.commandElementsDao = [];
      this.commandElementValuesDao = [];
      this.planOrdersDao = [];
      this.planOrderValuesDao = [];
      this.planOrderCommandElementsDao = [];
    }

    //parse CSV file content to JSON
    function csvToJson(csv) {
      var lines = csv.split("\n");
      var result = [];
      var headers = lines[0].split(";");

      for (var i = 1; i < lines.length; i++) {
        var obj = {};
        var currentline = lines[i].split(";");

        for (var j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentline[j];
        }

        result.push(obj);
      }

      return result;
    }

    function updateObject(oldItem, newItem) {
      if (oldItem) {
        if (newItem) {
          for (let i in newItem) {
            if (typeof newItem[i] === "object" && newItem[i] !== null) {
              oldItem[i] = updateObject(oldItem[i], newItem[i]);
            } else if (newItem[i] !== undefined) {
              oldItem[i] = newItem[i];
            }
          }
        }
      } else {
        oldItem = newItem;
      }

      return oldItem;
    }

    class Plan {
      constructor(planId, alias, description) {
        this.planId = planId;
        this.planModeTypeId = 1;
        this.alias = alias;
        this.description = description;
        this.enabled = true;
        this.visible = true;
        this.createdAt = "CURRENT_TIMESTAMP";
        this.updatedAt = "CURRENT_TIMESTAMP";
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.plans (plan_id, plan_mode_type_id, alias, description, enabled, visible, created_at, updated_at) VALUES " +
          LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.planId +
          ", " +
          this.planModeTypeId +
          ", '" +
          this.alias +
          "', " +
          this.description +
          ", " +
          this.enabled +
          ", " +
          this.visible +
          ", " +
          this.createdAt +
          ", " +
          this.updatedAt +
          ")," +
          LINE_BREAK;
        return result;
      }
    }

    class PlanNode {
      constructor(planId = null, nodeId, alias, description) {
        this.planId = planId;
        this.nodeId = nodeId;
        this.alias = alias;
        this.description = description;
        this.enabled = true;
        this.visible = true;
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.plan_nodes (node_id, alias, description, plan_id, enabled, visible) VALUES " + LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.nodeId +
          ", '" +
          this.alias +
          "', '" +
          this.description +
          "', " +
          this.planId +
          ", " +
          this.enabled +
          ", " +
          this.visible +
          ")," +
          LINE_BREAK;
        return result;
      }
    }

    class PlanNodeHirarchy {
      constructor(nodeParentId, nodeChildId) {
        this.nodeParentId = nodeParentId;
        this.nodeChildId = nodeChildId;
        this.enabled = true;
        this.visible = true;
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.plan_node_hierarchies (node_parent_id, node_child_id, enabled, visible) VALUES " + LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.nodeParentId +
          ", " +
          this.nodeChildId +
          ", " +
          this.enabled +
          ", " +
          this.visible +
          ")," +
          LINE_BREAK;
        return result;
      }
    }

    class CommandElement {
      constructor(commandElementTypeId, elementTypeId, commandElementId, elementId) {
        this.commandElementTypeId = commandElementTypeId;
        this.elementTypeId = elementTypeId;
        this.commandElementId = commandElementId;
        this.elementId = elementId;
        this.enabled = true;
        this.visible = true;
        this.createdAt = "CURRENT_TIMESTAMP";
        this.updatedAt = "CURRENT_TIMESTAMP";
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.command_elements (command_element_type_id, element_type_id, command_element_id, element_id, enabled, visible, created_at, updated_at) VALUES " +
          LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.commandElementTypeId +
          ", " +
          this.elementTypeId +
          ", " +
          this.commandElementId +
          ", " +
          this.elementId +
          ", " +
          this.enabled +
          ", " +
          this.visible +
          ", " +
          this.createdAt +
          ", " +
          this.updatedAt +
          ")," +
          LINE_BREAK;
        return result;
      }
    }

    class CommandElementValue {
      constructor(commandElementTypeId, elementTypeId, commandElementId, value) {
        this.commandElementTypeId = commandElementTypeId;
        this.elementTypeId = elementTypeId;
        this.commandElementTypeParamId = 1;
        this.commandElementId = commandElementId;
        this.value = value;
        this.enabled = true;
        this.visible = true;
        this.createdAt = "CURRENT_TIMESTAMP";
        this.updatedAt = "CURRENT_TIMESTAMP";
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.command_element_values (command_element_type_id, element_type_id, command_element_type_param_id, command_element_id, value, enabled, visible, created_at, updated_at) VALUES " +
          LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.commandElementTypeId +
          ", " +
          this.elementTypeId +
          ", " +
          this.commandElementTypeParamId +
          ", " +
          this.commandElementId +
          ", '" +
          this.value +
          "', " +
          this.enabled +
          ", " +
          this.visible +
          ", " +
          this.createdAt +
          ", " +
          this.updatedAt +
          ")," +
          LINE_BREAK;
        return result;
      }
    }

    class PlanOrder {
      constructor(planId, planOrderId, planOrderOrder, alias, description) {
        this.planId = planId;
        this.planOrderId = planOrderId;
        this.planOrderOrder = planOrderOrder;
        this.alias = alias;
        this.description = description;
        this.planOrderTypeId = 1;
        this.nextPlanOrderId = null;
        this.nextPlanId = null;
        this.enabled = true;
        this.visible = true;
        this.createdAt = "CURRENT_TIMESTAMP";
        this.updatedAt = "CURRENT_TIMESTAMP";
      }

      static insertHeader() {
        let result =
          "INSERT INTO conf.plan_orders(plan_id, plan_order_id, plan_order_type_id, plan_order_order, next_plan_order_id, next_plan_id, alias, description, enabled, visible, created_at, updated_at) VALUES " +
          LINE_BREAK;
        return result;
      }

      insertRow() {
        let result =
          "( " +
          this.planId +
          ", " +
          this.planOrderId +
          ", " +
          this.planOrderTypeId +
          ", " +
          this.planOrderOrder +
          ", " +
          this.nextPlanOrderId +
          ", " +
          this.nextPlanId +
          ", '" +
          this.alias +
          "', '" +
          this.description +
          "', " +
          this.enabled +
          ", " +
          this.visible +
          ", " +
          this.createdAt +
          ", " +
          this.updatedAt +
          ") ," +
          LINE_BREAK;
        return result;
      }
    }

    class PlanOrderValue {
      constructor(planId) {
        this.planId = null;
        this.planOrderId = null;
        this.planOrderTypeId = 5;
        this.planOrderTypeParamId = 1;
        this.planValue = 1;
        this.enabled = true;
        this.visible = true;
        this.createdAt = "CURRENT_TIMESTAMP";
        this.updatedAt = "CURRENT_TIMESTAMP";
      }

