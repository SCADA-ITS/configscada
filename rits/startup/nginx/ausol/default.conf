# needed for CSRF and JasperReports Server
underscores_in_headers on;

location /jasperserver {
    proxy_pass http://192.168.175.134:8083/jasperserver;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real_IP $remote_addr;
    proxy_set_header Authorization "Basic dXNlcjpiaXRuYW1p"; #user:bitnami
    #proxy_set_header Authorization "Basic amFzcGVyYWRtaW46amFzcGVyYWRtaW4="; #jasperadmin:jasperadmin 
}